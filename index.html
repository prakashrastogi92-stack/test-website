
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Website Manager</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
            text-align: center;
        }

        .container {
            margin: 100px auto;
            padding: 40px;
            max-width: 600px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #444;
            font-size: 18px;
        }

        button {
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to AI Website Manager</h1>
        <p>Your first test website is ready!</p>
        <button onclick="alert('Congratulations! Your website is working!')">
            Click Here
        </button>
    </div>

</body>
</html>
